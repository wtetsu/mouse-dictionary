name: License

permissions:
  contents: write
  pull-requests: write

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install Packages
        run: npm ci
      - name: License
        run: npx --yes license-checker@25.0.1 --json --out license.json
      - name: Make HTML
        run: node tools/make_license_html.ts license.json
      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          files: license.html
